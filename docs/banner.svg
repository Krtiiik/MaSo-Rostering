<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Český návod k aplikaci: Rozdělování pomocníků krok za krokem">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd842" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd842" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd842" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="280" rx="28"/></clipPath>
    <clipPath id="btnClip"><rect x="80" y="182" width="340" height="70" rx="35"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#ffd842"/>

    <!-- decorative shapes -->
    <circle cx="1090" cy="40" r="170" fill="#ffe953" opacity="0.7"/>
    <circle cx="1010" cy="250" r="120" fill="#ffffff" opacity="0.25"/>
    <rect x="0" y="262" width="1200" height="18" fill="#000000"/>

    <!-- stylised roster grid on the right -->
    <g transform="translate(800 40)">
      <rect x="8" y="8" width="320" height="176" rx="16" fill="#000000"/>
      <rect width="320" height="176" rx="16" fill="#ffffff" stroke="#000000" stroke-width="4"/>
      <g fill="#f1f1f1" stroke="#000000" stroke-width="2">
        <rect x="16" y="16" width="88" height="36" rx="8"/>
        <rect x="116" y="16" width="88" height="36" rx="8"/>
        <rect x="216" y="16" width="88" height="36" rx="8"/>
        <rect x="16" y="62" width="88" height="36" rx="8"/>
        <rect x="216" y="62" width="88" height="36" rx="8"/>
        <rect x="16" y="108" width="88" height="36" rx="8"/>
        <rect x="116" y="108" width="88" height="36" rx="8"/>
      </g>
      <rect x="116" y="62" width="88" height="36" rx="8" fill="#ffd842" stroke="#000000" stroke-width="2">
        <animate attributeName="x" values="116;216;116" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.6 0 0.4 1;0.6 0 0.4 1"/>
      </rect>
      <rect x="216" y="108" width="88" height="36" rx="8" fill="#000000"/>
    </g>

    <!-- text -->
    <text x="80" y="84" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif" font-size="18" font-weight="700" letter-spacing="4" fill="#000000">ČESKÝ NÁVOD  ·  KROK ZA KROKEM  ·  S OBRÁZKY</text>
    <text x="80" y="146" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif" font-size="52" font-weight="800" fill="#000000">Rozdělování pomocníků</text>

    <!-- button -->
    <rect x="86" y="188" width="340" height="70" rx="35" fill="#ffffff"/>
    <rect x="80" y="182" width="340" height="70" rx="35" fill="#000000"/>
    <g clip-path="url(#btnClip)">
      <rect x="-120" y="182" width="90" height="70" fill="url(#sheen)" transform="skewX(-20)">
        <animate attributeName="x" values="-120;620" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="250" y="227" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif" font-size="30" font-weight="800" fill="#ffffff">Otevřít návod  →</text>
  </g>
</svg>

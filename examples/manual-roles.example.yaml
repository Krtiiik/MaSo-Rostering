# Example manual-roles overlay file (see rostering/manual.py and CLAUDE.md
# "Out-of-solver roles"). Pass this to `rostering solve --manual-roles ...`.
# helper_id refers to the `id` column in the season's helpers.csv.

structural:
  - role: VedouciBudovy       # building lead
    building: Malá Strana
    helper_id: 1
  - role: PravaRuka           # building lead's deputy
    building: Malá Strana
    helper_id: 2
  - role: VedouciMistnosti    # room lead — needs `room` too
    building: Malá Strana
    room: S3
    helper_id: 3
  - role: TechnickaPodpora
    building: Karlov
    helper_id: 4

overlay:
  - role: Registrace                # registration desk — building-scoped:
    helper_id: 5                    # must be a building the helper is
    building: Malá Strana           # already solved into
  - role: UvadeciUcastniku          # ushering participants — room-scoped:
    helper_id: 6                    # must be a room the helper is already
    building: Malá Strana           # solved into
    room: S3
  - role: FoceniPredavaniCen        # photographing the award ceremony —
    helper_id: 6                    # also room-scoped
    building: Malá Strana
    room: S3

[project]
name = "rostering"
version = "0.1.0"
description = "Helper-roster solver for the MaSo math competition"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rostering = "rostering.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "rostering"
version = "0.1.0"
description = "Helper-roster solver for the MaSo math competition"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.10"]

[project.scripts]
rostering = "rostering.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostering*"]

[tool.setuptools.package-data]
"rostering.persistence" = ["default-buildings-config.yaml"]

# The drag-and-drop assignment-grid custom Streamlit component
# (components/rostering-assignment-grid/) is a separate installable
# package, not part of this distribution — see README.md "Setup".

[tool.pytest.ini_options]
testpaths = ["tests"]

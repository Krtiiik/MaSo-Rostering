[project]
name = "rostering"
version = "3.3.0"
description = "Helper-roster solver for the MaSo math competition"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "nicegui>=3.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
packaging = ["pyinstaller>=6.10"]

[project.scripts]
rostering = "rostering.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rostering*"]

[tool.setuptools.package-data]
# The roster grid's browser half, served by NiceGUI as is (no build step).
"rostering.webapp.ui.grid" = ["*.js"]
# The Tags tab's drag-and-drop tree, likewise.
"rostering.webapp.ui.tagtree" = ["*.js"]
# The page icon (the MaSo site's favicon).
"rostering.webapp.ui" = ["assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The web app's tests drive NiceGUI's async user simulation.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

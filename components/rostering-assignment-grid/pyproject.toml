[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rostering-assignment-grid"
version = "0.0.1"
description = "Drag-and-drop role assignment grid for the rostering app"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lukas Nedbalek", email = "lukas.nedbalek@email.cz" }]
dependencies = ["streamlit >= 1.51"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["rostering_assignment_grid*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
rostering_assignment_grid = ["frontend/build/**/*", "pyproject.toml"]
